<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#030304" />
    <title>Voce Italiana</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="backdrop" aria-hidden="true"></div>

    <header class="topbar">
      <span class="icon-orb"><span class="msr">graphic_eq</span></span>
      <div class="topbar-text">
        <h1 class="title">Voce Italiana</h1>
        <p class="subtitle">استخراج الكلام الإيطالي من أي ملف صوتي</p>
      </div>
    </header>

    <main>
      <section class="glass accent">
        <div class="card-head">
          <span class="glow-icon" id="fileIcon" style="--c: var(--amber)"><span class="msr">audio_file</span></span>
          <div>
            <h2>الملف الصوتي</h2>
            <p class="dim" id="fileLabel">mp3 · m4a · wav · opus · ogg · mp4</p>
          </div>
        </div>

        <label class="drop">
          <input type="file" id="file" accept="audio/*,video/*,.mp3,.wav,.m4a,.ogg,.opus,.aac,.flac,.webm,.mp4" />
          <span class="msr drop-icon">upload_file</span>
          <span>اختار ملف من الموبايل</span>
        </label>
        <audio id="player" controls hidden></audio>

        <div class="section-title">
          <i></i>
          <div>
            <p class="section-sub">Whisper</p>
            <h3>الموديل</h3>
          </div>
        </div>
        <div class="chips" id="models" role="radiogroup">
          <button class="chip" data-model="base" role="radio">Base · سريع</button>
          <button class="chip selected" data-model="small" role="radio">Small · دقيق</button>
          <button class="chip" data-model="turbo" role="radio">Turbo · الأدق</button>
        </div>
        <p class="dim small" id="modelHint"></p>

        <button class="btn-neon" id="go" disabled>
          <span class="msr">play_arrow</span>ابدأ استخراج الكلام
        </button>
      </section>

      <section class="glass" id="statusCard" hidden>
        <div class="card-head">
          <span class="glow-icon" id="statusIcon"><span class="msr" id="statusSymbol">hourglass_top</span></span>
          <div class="grow">
            <h2 id="statusTitle"></h2>
            <p class="dim" id="statusText"></p>
          </div>
        </div>
        <div class="glow-bar"><i id="barFill"></i></div>
      </section>

      <section class="glass" id="resultCard" hidden>
        <div class="section-title">
          <i></i>
          <div class="grow">
            <p class="section-sub">Italiano</p>
            <h3>النص</h3>
          </div>
          <button class="chip" id="showTs" aria-pressed="false"><span class="msr">schedule</span>توقيتات</button>
        </div>
        <div id="result" class="result" dir="ltr" lang="it" contenteditable="true" spellcheck="true"></div>
        <div class="actions">
          <button class="btn-ghost" id="copy"><span class="msr">content_copy</span><span>نسخ</span></button>
          <button class="btn-ghost" id="share"><span class="msr">share</span><span>مشاركة</span></button>
          <button class="btn-ghost" id="txt"><span class="msr">description</span><span>TXT</span></button>
          <button class="btn-ghost" id="srt"><span class="msr">subtitles</span><span>SRT</span></button>
        </div>
      </section>

      <footer class="dim small">
        <span class="msr">lock</span>
        المعالجة كلها على جهازك والملف مش بيترفع على أي سيرفر. أول مرة بس محتاج إنترنت لتحميل الموديل.
      </footer>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
