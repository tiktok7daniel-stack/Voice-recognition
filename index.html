<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <title>Voce Italiana</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main>
      <header>
        <img src="icon.svg" alt="" width="44" height="44" />
        <div>
          <h1>Voce Italiana</h1>
          <p class="sub">تحويل الصوت الإيطالي إلى نص — يشتغل على الموبايل بدون إنترنت بعد أول تحميل</p>
        </div>
      </header>

      <section class="card">
        <label class="drop" id="drop">
          <input type="file" id="file" accept="audio/*,video/*,.mp3,.wav,.m4a,.ogg,.opus,.aac,.flac,.webm,.mp4" />
          <span class="drop-icon">🎙️</span>
          <span id="fileLabel">اختار ملف صوتي (mp3, m4a, wav, opus, ogg…)</span>
        </label>
        <audio id="player" controls hidden></audio>

        <label class="field">
          <span>الموديل</span>
          <select id="model">
            <option value="base">Whisper Base — سريع (~80MB)</option>
            <option value="small" selected>Whisper Small — دقة عالية (~250MB)</option>
            <option value="turbo">Whisper Large v3 Turbo — الأدق، تقيل (~600MB+)</option>
          </select>
        </label>

        <button id="go" disabled>ابدأ استخراج الكلام الإيطالي</button>

        <div id="status" class="status" hidden>
          <div class="bar"><div id="barFill"></div></div>
          <p id="statusText"></p>
        </div>
      </section>

      <section class="card" id="resultCard" hidden>
        <div class="result-head">
          <h2>النص (Italiano)</h2>
          <label class="toggle"><input type="checkbox" id="showTs" /> توقيتات</label>
        </div>
        <div id="result" class="result" dir="ltr" lang="it" contenteditable="true" spellcheck="true"></div>
        <div class="actions">
          <button id="copy" class="secondary">نسخ</button>
          <button id="share" class="secondary">مشاركة</button>
          <button id="txt" class="secondary">تحميل TXT</button>
          <button id="srt" class="secondary">تحميل SRT</button>
        </div>
      </section>

      <footer>
        كل المعالجة بتتم على جهازك — الملف مش بيترفع على أي سيرفر. الموديلات: OpenAI Whisper (مفتوح المصدر) عبر Transformers.js.
      </footer>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
