name: Build Android APK

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  SHERPA_ONNX_VERSION: 1.13.8

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Fetch sherpa-onnx engine and Silero VAD
        run: |
          mkdir -p app/libs app/src/main/assets
          curl -fSL -o app/libs/sherpa-onnx.aar \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/v${SHERPA_ONNX_VERSION}/sherpa-onnx-${SHERPA_ONNX_VERSION}.aar"
          curl -fSL -o app/src/main/assets/silero_vad.onnx \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/silero_vad.onnx"
          ls -lh app/libs app/src/main/assets

      - name: Check every model file the app downloads exists
        run: |
          python3 - <<'PY'
          import re, subprocess, sys
          src = open("app/src/main/java/com/tiktok7daniel/voceitaliana/asr/Models.kt").read()
          bad = 0
          for block in re.findall(r'hfRepo = "[^"]+",.*?\n    \)', src, re.S):
              repo = re.search(r'hfRepo = "([^"]+)"', block).group(1)
              files = re.search(r'files = listOf\(([^)]*)\)', block).group(1)
              m = re.search(r'baseUrl = "([^"]+)"', block)
              base = m.group(1) if m else f"https://huggingface.co/{repo}/resolve/main"
              total = 0
              for f in re.findall(r'"([^"]+)"', files):
                  url = f"{base}/{f}"
                  out = subprocess.run(["curl", "-sIL", url], capture_output=True, text=True).stdout
                  codes = re.findall(r"^HTTP/\S+ (\d+)", out, re.M)
                  sizes = re.findall(r"^(?:content-length|x-linked-size): (\d+)", out, re.M | re.I)
                  ok = bool(codes) and codes[-1] == "200"
                  size = max(map(int, sizes)) if sizes else 0
                  total += size
                  print(("OK " if ok else "MISSING ") + url + f"  {size/1e6:.0f} MB")
                  bad += not ok
              print(f"== {repo}: {total/1e6:.0f} MB\n")
          sys.exit(1 if bad else 0)
          PY

      - name: Build APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace
      - run: cp app/build/outputs/apk/release/app-release.apk VoceItaliana.apk

      - name: Publish to "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Voce Italiana – latest APK
          make_latest: true
          body: |
            Latest Android build from `${{ github.ref_name }}` (${{ github.sha }}).
            Download **VoceItaliana.apk**, open it on your phone and allow "install unknown apps".
          files: VoceItaliana.apk

  emulator-smoke-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [34, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Fetch sherpa-onnx engine and Silero VAD
        run: |
          mkdir -p app/libs app/src/main/assets
          curl -fSL -o app/libs/sherpa-onnx.aar \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/v${SHERPA_ONNX_VERSION}/sherpa-onnx-${SHERPA_ONNX_VERSION}.aar"
          curl -fSL -o app/src/main/assets/silero_vad.onnx \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/silero_vad.onnx"
      - name: Build APK with emulator ABI
        run: ./gradlew assembleRelease -Pemulator --no-daemon
      - name: Free disk space for the emulator
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/node_modules /opt/hostedtoolcache/CodeQL && df -h /
      - name: Make two Italian test clips
        run: |
          sudo apt-get install -y -qq espeak-ng >/dev/null
          espeak-ng -v it -s 150 -w it1.wav "Buongiorno a tutti. Oggi parliamo del riconoscimento vocale in italiano."
          espeak-ng -v it -s 150 -w it2.wav "La pizza margherita è nata a Napoli. Grazie mille e arrivederci."
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on emulator (API ${{ matrix.api-level }})
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          ram-size: 4096M
          disk-size: 4096M
          force-avd-creation: true
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -no-snapshot -no-metrics -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 .github/scripts/smoke.py app/build/outputs/apk/release/app-release.apk it1.wav it2.wav
