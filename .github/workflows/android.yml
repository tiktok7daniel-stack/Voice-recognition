name: Build Android APK

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build web app
        run: npm run build

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../VoceItaliana.apk

      - uses: actions/upload-artifact@v4
        with:
          name: VoceItaliana-apk
          path: VoceItaliana.apk

      - name: Publish to "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Voce Italiana – latest APK
          prerelease: false
          make_latest: true
          body: |
            Latest Android build from `${{ github.ref_name }}` (${{ github.sha }}).
            Download **VoceItaliana.apk**, open it on your phone and allow "install unknown apps".
          files: VoceItaliana.apk
