name: Build Android APK

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

env:
  SHERPA_ONNX_VERSION: 1.13.8

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Fetch sherpa-onnx engine and Silero VAD
        run: |
          mkdir -p app/libs app/src/main/assets
          curl -fSL -o app/libs/sherpa-onnx.aar \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/v${SHERPA_ONNX_VERSION}/sherpa-onnx-${SHERPA_ONNX_VERSION}.aar"
          curl -fSL -o app/src/main/assets/silero_vad.onnx \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/silero_vad.onnx"
          ls -lh app/libs app/src/main/assets

      - name: Check every model file the app downloads exists
        run: |
          python3 - <<'PY'
          import re, subprocess, sys
          src = open("app/src/main/java/com/tiktok7daniel/voceitaliana/asr/Models.kt").read()
          bad = 0
          for repo, files in re.findall(r'hfRepo = "([^"]+)",\s*files = listOf\(([^)]*)\)', src):
              total = 0
              for f in re.findall(r'"([^"]+)"', files):
                  url = f"https://huggingface.co/{repo}/resolve/main/{f}"
                  out = subprocess.run(["curl", "-sIL", url], capture_output=True, text=True).stdout
                  codes = re.findall(r"^HTTP/\S+ (\d+)", out, re.M)
                  sizes = re.findall(r"^(?:content-length|x-linked-size): (\d+)", out, re.M | re.I)
                  ok = codes and codes[-1] == "200"
                  size = max(map(int, sizes)) if sizes else 0
                  total += size
                  print(("OK " if ok else "MISSING ") + url + f"  {size/1e6:.0f} MB")
                  bad += not ok
              print(f"== {repo}: {total/1e6:.0f} MB\n")
          sys.exit(1 if bad else 0)
          PY

      - name: Build APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace
      - run: cp app/build/outputs/apk/release/app-release.apk VoceItaliana.apk

      - uses: actions/upload-artifact@v4
        with:
          name: VoceItaliana-apk
          path: VoceItaliana.apk

      - name: Publish to "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Voce Italiana – latest APK
          make_latest: true
          body: |
            Latest Android build from `${{ github.ref_name }}` (${{ github.sha }}).
            Download **VoceItaliana.apk**, open it on your phone and allow "install unknown apps".
          files: VoceItaliana.apk
